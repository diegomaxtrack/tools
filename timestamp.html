<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Maxtrack | Conversor de Timestamp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
<style>
  :root {
    --mx-navy: #283555;
    --mx-navy-dark: #1c2740;
    --mx-orange-dark: #F47920;
    --mx-orange: #F99D34;
    --mx-orange-light: #FDB94D;
    --mx-bg: #F3F4F7;
    --mx-text-muted: #6b7280;
    --mx-border: #e3e5ea;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    font-family: 'Montserrat', Arial, sans-serif;
    background: var(--mx-bg);
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
    padding: 0.8rem;
  }
  .wrapper {
    width: 100%;
    max-width: 720px;
  }
  .brand-header {
    background: linear-gradient(135deg, var(--mx-navy) 0%, var(--mx-navy-dark) 100%);
    border-radius: 12px 12px 0 0;
    padding: 0.7rem 1.2rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-header img {
    height: 18px;
    width: auto;
  }
  .brand-header .titulo {
    color: #ffffff;
    font-size: 0.8rem;
    font-weight: 400;
    letter-spacing: 0.02em;
    border-left: 1px solid rgba(255,255,255,0.25);
    padding-left: 10px;
  }
  .card {
    background: #ffffff;
    padding: 1rem 1.2rem 1.1rem;
    border-radius: 0 0 12px 12px;
    box-shadow: 0 4px 20px rgba(40,53,85,0.08);
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.1rem;
  }
  .divisor-v {
    display: none;
  }
  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
    .coluna + .coluna { border-top: 1px solid var(--mx-border); padding-top: 0.8rem; margin-top: 0.2rem; }
  }
  h1 {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--mx-navy);
    margin: 0 0 0.55rem;
  }
  label.campo {
    display: block;
    font-size: 0.65rem;
    font-weight: 500;
    color: var(--mx-text-muted);
    margin-bottom: 0.25rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  input {
    width: 100%;
    padding: 0.45rem 0.6rem;
    margin-bottom: 0.4rem;
    border-radius: 6px;
    border: 1px solid var(--mx-border);
    font-size: 0.85rem;
    font-family: 'Montserrat', Arial, sans-serif;
    color: var(--mx-navy);
    background: #fafbfc;
  }
  input:focus {
    outline: none;
    border-color: var(--mx-orange);
    background: #ffffff;
  }
  button {
    width: 100%;
    padding: 0.45rem;
    border-radius: 6px;
    border: none;
    font-size: 0.78rem;
    font-weight: 600;
    font-family: 'Montserrat', Arial, sans-serif;
    letter-spacing: 0.02em;
    color: #ffffff;
    cursor: pointer;
    background: linear-gradient(90deg, var(--mx-orange-dark), var(--mx-orange));
  }
  button:hover { filter: brightness(1.06); }
  .agora {
    margin-top: 0.35rem;
    font-size: 0.68rem;
    color: var(--mx-orange-dark);
    text-align: center;
    cursor: pointer;
    font-weight: 500;
  }
  .agora:hover { text-decoration: underline; }
  .resultado {
    margin-top: 0.6rem;
    padding: 0.55rem 0.7rem;
    background: #fbf7f0;
    border-left: 3px solid var(--mx-orange);
    border-radius: 0 6px 6px 0;
    font-size: 0.74rem;
    line-height: 1.45;
    color: var(--mx-navy);
    word-break: break-word;
  }
  .resultado strong {
    font-weight: 600;
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    display: block;
    color: var(--mx-orange-dark);
  }
  .resultado div + strong { margin-top: 4px; }
  .rodape {
    text-align: center;
    margin-top: 0.5rem;
    font-size: 0.6rem;
    color: var(--mx-text-muted);
  }
</style>
</head>

      <div class="coluna">
        <h1>Timestamp Unix (UTC-3)</h1>
        <label class="campo">Timestamp Unix (segundos)</label>
        <input type="text" id="timestamp" placeholder="Ex: 1755700000">
        <button onclick="converter()">Converter</button>

      </div>

        <h1>Referenciado ao ano 2000</h1>
        <label class="campo">Valor de ARCH_GetTimeStamp_year2000</label>
        <input type="text" id="timestampY2K" placeholder="Ex: 808000000">
        <button onclick="converterY2K()">Converter</button>
        <div class="agora" onclick="usarAgoraY2K()">usar o valor atual</div>

<script>
const EPOCH_ANO2000 = 946684800;

function formatarSaida(tsUnixSegundos) {
  const dataUTC = new Date(tsUnixSegundos * 1000);
  const offsetMs = -3 * 60 * 60 * 1000;
  const dataFuso = new Date(dataUTC.getTime() + offsetMs);

  const dias = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

  const diaSemana = dias[dataFuso.getUTCDay()];
  const dia = String(dataFuso.getUTCDate()).padStart(2,'0');
  const mesNome = meses[dataFuso.getUTCMonth()];
  const mes = String(dataFuso.getUTCMonth()+1).padStart(2,'0');
  const ano = dataFuso.getUTCFullYear();
  const hora = String(dataFuso.getUTCHours()).padStart(2,'0');
  const minuto = String(dataFuso.getUTCMinutes()).padStart(2,'0');
  const segundo = String(dataFuso.getUTCSeconds()).padStart(2,'0');

  const dataFormatada = `${dia}/${mes}/${ano} ${hora}:${minuto}:${segundo}`;
  const dataExtenso = `${diaSemana}, ${dia} de ${mesNome} de ${ano}`;
  const isoFuso = `${ano}-${mes}-${dia}T${hora}:${minuto}:${segundo}-03:00`;
  const valorAno2000 = Math.round(tsUnixSegundos - EPOCH_ANO2000);

  return `
    <strong>Data e hora (UTC-3)</strong>${dataFormatada}<br>
    <strong>Por extenso</strong>${dataExtenso}<br>
    <strong>Formato ISO</strong>${isoFuso}<br>
    <strong>Ano 2000</strong>${valorAno2000 >= 0 ? valorAno2000 : 'anterior a 01/01/2000'}
  `;
}

function usarAgora() {
  const agora = Math.floor(Date.now() / 1000);
  document.getElementById('timestamp').value = agora;
  converter();
}

function converter() {
  const input = document.getElementById('timestamp').value.trim();
  const resultadoDiv = document.getElementById('resultado');

  if (!input || isNaN(input)) {
    resultadoDiv.style.display = 'block';
    resultadoDiv.innerHTML = 'Digite um timestamp válido.';
    return;
  }

  let ts = Number(input);
  if (input.length >= 13) {
    ts = ts / 1000;
  }

  resultadoDiv.style.display = 'block';
  resultadoDiv.innerHTML = formatarSaida(ts);
}

function usarAgoraY2K() {
  const agora = Math.floor(Date.now() / 1000) - EPOCH_ANO2000;
  document.getElementById('timestampY2K').value = agora >= 0 ? agora : 0;
  converterY2K();
}

function converterY2K() {
  const input = document.getElementById('timestampY2K').value.trim();
  const resultadoDiv = document.getElementById('resultadoY2K');

  if (!input || isNaN(input)) {
    resultadoDiv.style.display = 'block';
    resultadoDiv.innerHTML = 'Digite um valor válido.';
    return;
  }

  const valorY2K = Number(input);
  const tsUnix = valorY2K + EPOCH_ANO2000;

  resultadoDiv.style.display = 'block';
  resultadoDiv.innerHTML = `<strong>Timestamp Unix</strong>${tsUnix}<br>` + formatarSaida(tsUnix);
}
</script>
