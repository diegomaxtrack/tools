<style>
  :root{
    --mt-navy: #1B2A4A;
    --mt-navy-2: #283555;
    --mt-navy-deep: #101A30;
    --mt-orange: #F47920;
    --mt-orange-mid: #F99D34;
    --mt-orange-light: #FDB94D;
    --mt-white: #FFFFFF;
    --mt-gray: #B8C2D6;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    height: 100%;
    overflow: hidden;
  }

  body{
    font-family: 'Montserrat', Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 15%, rgba(244,121,32,0.10), transparent 45%),
      linear-gradient(160deg, var(--mt-navy-deep) 0%, var(--mt-navy) 55%, var(--mt-navy-2) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--mt-white);
  }

  .card{
    width: 400px;
    max-width: 90vw;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 34px 32px 30px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }

  .logo-wrap{
    display: flex;
    justify-content: center;
    margin-bottom: 6px;
  }

  .logo-wrap img{
    height: 40px;
    width: auto;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
  }

  .subtitle{
    font-weight: 400;
    font-size: 12.5px;
    color: var(--mt-gray);
    letter-spacing: 0.4px;
    margin-top: 10px;
    margin-bottom: 26px;
    text-transform: uppercase;
  }

  .links{
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .btn{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px 18px;
    background: linear-gradient(135deg, var(--mt-orange), var(--mt-orange-light));
    color: var(--mt-white);
    text-decoration: none;
    font-family: 'Montserrat', Arial, sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.2px;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(244, 121, 32, 0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }

  .btn.secondary{
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: none;
  }

  .btn:hover{
    transform: translateY(-2px);
    filter: brightness(1.06);
  }

  .btn.secondary:hover{
    background: rgba(255,255,255,0.1);
  }

  .btn:active{
    transform: translateY(0);
  }

  .btn svg{
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .footer{
    margin-top: 24px;
    font-size: 10.5px;
    color: rgba(184, 194, 214, 0.55);
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
